<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Inteligent Elev</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>Card Inteligent Elev</h1>
            <p>Conectat la C++ Backend</p>
        </header>

        <div class="card glass">
            <div class="card-header">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Elev" alt="Avatar" class="avatar">
                <div class="info">
                    <h2 id="nume-elev">Se încarcă...</h2>
                    <p id="detalii-clasa">Clasa: Se încarcă...</p>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <h3>Media Generală</h3>
                    <p id="medie-generala" class="highlight">--</p>
                </div>
                <div class="stat-box">
                    <h3>Părinte</h3>
                    <p id="nume-parinte">--</p>
                </div>
            </div>
        </div>

        <div class="actions">
            <button onclick="incarcaDatele()" class="btn primary">🔄 Reîncarcă Datele</button>
        </div>

        <div class="materii-section glass">
            <h3>📖 Situație Școlară</h3>
            <ul id="lista-materii" class="materii-list">
                <!-- Aici se vor incarca materiile din C++ -->
                <li>Se încarcă materiile...</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
